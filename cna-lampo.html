<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#080d18;--line:#26334d;--txt:#f8fafc}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--txt)}
body{height:100dvh}
.app{height:100dvh;padding:max(4px,env(safe-area-inset-top)) 4px max(3px,env(safe-area-inset-bottom));display:grid;grid-template-rows:42px 1fr 15px;gap:3px}
.head{background:#111827;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;padding:5px 8px;gap:7px;overflow:hidden}

.card::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}

.num{position:absolute;left:3px;top:2px;color:#64748b;font-size:6.5px;font-weight:900}
.abbr{font-size:6.1px;line-height:1;color:var(--accent);font-weight:950;margin-bottom:2px}
.name{font-size:clamp(5.9px,1.55vw,7.8px);font-weight:900;line-height:1.04;text-align:center;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;text-wrap:balance}
.foot{display:flex;justify-content:center;align-items:center;gap:6px;color:#7f8da6;font-size:6.6px;white-space:nowrap;overflow:hidden}.dot{width:4px;height:4px;border-radius:50%;display:inline-block;margin-right:2px}
.hot{position:fixed;right:0;bottom:0;width:44px;height:44px;z-index:110;background:rgba(255,255,255,.01)}

.toprow{display:flex;align-items:flex-start;gap:8px}.cat{font-size:11px;font-weight:950;letter-spacing:.05em;color:var(--accent)}.sheet h2{font-size:24px;line-height:1.06;margin:2px 0 10px}
.close{margin-left:auto;width:34px;height:34px;border:0;border-radius:50%;background:#1b2638;color:#fff;font-size:20px}
.words{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 11px}.word{background:#162235;border:1px solid #29435c;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:900;color:#f8fafc}
.logic{font-size:14px;font-weight:900;line-height:1.38;color:#f0643c;margin-bottom:10px}
.answer{background:#08101e;border-left:5px solid var(--accent);padding:10px 11px;font-size:15px;line-height:1.48;color:#e5e7eb}
.clock{position:fixed;inset:0;z-index:120;background:#000;color:#fff;display:none;align-items:center;justify-content:center;user-select:none}.clock.open{display:flex}
.time{font-size:min(31vw,160px);font-weight:300;line-height:1;letter-spacing:-.055em}.backHot{position:absolute;right:0;bottom:0;width:44px;height:44px;background:rgba(255,255,255,.01)}
@media(orientation:landscape){.app{grid-template-rows:34px 1fr 12px}.grid{grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(6,minmax(0,1fr))}.name{font-size:clamp(5.7px,1vw,7.7px)}.abbr{font-size:5.8px}}
@media(max-height:700px) and (orientation:portrait){.app{grid-template-rows:34px 1fr 12px}.name{font-size:5.4px}.abbr{font-size:5.2px}}
</style>

<script>
const D=[
['Senza palla','Posizione fondamentale offensiva','Piedi|Avampiedi|Flesso|Mani|Visione','TECNICA: equilibrio e prontezza · TATTICA: essere pronti a giocare','Piedi alla larghezza di spalle/bacino, peso sugli avampiedi, caviglie e ginocchia piegate, busto leggermente avanti, mani pronte e visione periferica.'],
['Senza palla','Corsa cestistica','Baricentro|Contatto|Prontezza|Cambio|Arresto','TECNICA: corsa disponibile · TATTICA: cambiare rapidamente','Baricentro più basso della corsa normale e piedi quanto più possibile vicini al suolo: il corpo resta pronto a cambiare direzione, senso, velocità, arrestarsi o fintare.'],
['Senza palla','Cambio di velocità senza palla','Ritmo|Lento-veloce|Veloce-lento|Spazio|Vantaggio','TECNICA: variazione netta · TATTICA: sbilanciare e occupare spazio','Alterno lento-veloce o veloce-lento per arrivare prima nello spazio o sbilanciare il difensore, collegando il cambio di ritmo alla lettura.'],
['Senza palla','Cambio direzione omologo senza palla','Accorcio|Avampiede|Ruoto|Spingo|Accelero','TECNICA: cambio immediato · TATTICA: dinamico con spazio','Accorcio il passo, carico l’avampiede, abbasso il baricentro, ruoto e spingo nella nuova direzione; secondo passo lungo e cambio di velocità.'],
['Senza palla','Cambio direzione incrociato senza palla','Baricentro|Avampiede|Opposto|Incrocio|Accelero','TECNICA: incrocio · TATTICA: statico/poco dinamico con spazio','Baricentro basso, spinta nella nuova direzione; il piede opposto incrocia come primo passo, poi trasferimento del peso e accelerazione.'],
['Senza palla','Giro frontale','Perno|Avampiede|Avanti|Spazio|Testa','TECNICA: piede libero avanti · TATTICA: più rapido con spazio','Peso sull’avampiede del perno, baricentro basso, piede libero spinge in avanti; perno fermo e testa alta.'],
['Senza palla','Giro dorsale','Perno|Avampiede|Indietro|Protezione|Testa','TECNICA: piede libero indietro · TATTICA: assenza di spazio','Peso sull’avampiede del perno, baricentro basso, piede libero spinge verso dietro; utile quando manca spazio e serve protezione.'],
['Senza palla','Arresto a un tempo','Saltello|Simultanei|Avampiedi|Equilibrio|Testa','TECNICA: due appoggi contemporanei · TATTICA: controllo e scelta','I due piedi prendono contatto contemporaneamente sugli avampiedi, con caviglie e ginocchia piegate e peso distribuito. Senza possesso non si parla di perno regolamentare.'],
['Senza palla','Arresto a due tempi','Successione|Primo|Secondo|Rallento|Equilibrio','TECNICA: appoggi successivi · TATTICA: arrestarsi da maggiore velocità','I piedi prendono contatto in successione: il primo appoggio contribuisce a rallentare, il secondo ristabilisce equilibrio. Primo appoggio e perno non sono automaticamente sinonimi in ogni situazione regolamentare.'],
['Con palla','Posizione fondamentale con palla','Avampiedi|Flesso|Pollici-T|Polso|Visione','TECNICA: triplice minaccia · TATTICA: eseguire rapidamente','Piedi alla larghezza delle spalle, peso sugli avampiedi, gambe flesse; presa con pollici a T, polso carico, palla pronta e visione periferica.'],
['Con palla','Presa e ricezione','Chiamare|Incontro|Presa|Pollici-T|Polso','TECNICA: controllo completo · TATTICA: non perdere tempo','Chiamo la palla, le vado incontro e realizzo una presa completa e sicura; pollici a T e polso carico preparano immediatamente il fondamentale successivo.'],
['Con palla','Partenza omologa','Direzione|Omologo|Libero|Perno|Palleggio','TECNICA CNA: parte il piede dello stesso lato · REGOLA: rispettare il perno','Verso destra parte il destro, verso sinistra il sinistro: è il piede libero; l’opposto resta perno. La palla deve essere rilasciata nel rispetto della regola dei passi.'],
['Con palla','Partenza incrociata','Direzione|Opposto|Incrocia|Perno|Protezione','TECNICA CNA: parte il piede opposto · TATTICA: proteggere sotto pressione','Il piede opposto alla direzione si muove per primo e incrocia; l’altro resta perno. Il corpo protegge la palla e il primo passo conquista spazio.'],
['Con palla','Piede perno e giro','Perno|Stabile|Libero|Rotazione|Protezione','TECNICA: ruotare in equilibrio · TATTICA: creare nuova linea','Il perno resta stabile mentre il piede libero modifica orientamento; palla protetta e testa alta per creare linea di passaggio, tiro o partenza.'],
['Palleggio','Palleggio','Contatto|Polpastrelli|Spinta|Polso|Visione','TECNICA: governare la palla · TATTICA: prendere/mantenere vantaggio o equilibrio','Nella fase di contatto la palla è governabile: polpastrelli, spinta alto-basso con avambraccio, polso e dita; busto eretto e sguardo sul campo.'],
['Palleggio','Palleggio protetto','Ginocchio|Lontano|Braccio|Corpo|Pressione','TECNICA: palla protetta · TATTICA: difensore a contatto','Palla lontana dal difensore circa al ginocchio; braccio libero, spalla e gamba proteggono. Si usa quando lo spazio col difensore diventa minimo.'],
['Palleggio','Palleggio spinto','Dietro|Spinta|Cintura|Corsa|Spazio','TECNICA: mano dietro la palla · TATTICA: raggiungere spazio rapidamente','Mano dietro la palla, spinta con braccio-avambraccio-polso-dita, altezza circa alla cintura; serve a raggiungere uno spazio nel minor tempo.'],
['Palleggio','Palleggio spinto alternato','Dietro|Alternanza|Cintura|Velocità|Spazio','TECNICA: alternare le mani · TATTICA: campo aperto senza avversari vicini','Mantiene la tecnica dello spinto ma alterna le mani; è utile per aumentare velocità quando non ci sono avversari nelle vicinanze.'],
['Palleggio','Cambio di velocità in palleggio','Sopra|Dietro|Ritmo|Cintola|Visione','TECNICA: cambia rapporto mano-palla · TATTICA: occupare spazio vantaggioso','Lento-veloce: mano da sopra a dietro; veloce-lento: da dietro a sopra. Cambio di ritmo con occhi sul campo e lettura dello spazio.'],
['Palleggio','Cambio frontale incrociato','Protetto|Basso|Esterno-interno|Incrocio|Accelero','TECNICA: cambio basso davanti · TATTICA: statico/poco dinamico con spazio','Dal palleggio protetto spingo esterno-interno sotto le ginocchia, ricevo con l’altra mano, incrocio e accelero nella nuova direzione.'],
['Palleggio','Cambio frontale omologo','Basso|Esterno-interno|Opposto|Ricevo|Accelero','TECNICA: uscita omologa · TATTICA: dinamico con spazio adeguato','Cambio basso davanti al corpo, mano opposta pronta; spinta dell’appoggio coerente con la nuova direzione, controllo e immediata accelerazione.'],
['Palleggio','Cambio dietro la schiena','Laterale-dietro|Diagonale|Protezione|Cambio|Velocità','TECNICA: palla dietro in diagonale · TATTICA: dinamico con difensore a contatto','La mano porta la palla lateralmente-dietro e la spinge in diagonale sul lato opposto; cambio di mano e velocità mantenendo protezione.'],
['Palleggio','Cambio sotto le gambe','Piede-avanti|Ginocchio|Esterno-interno|Sotto|Accelero','TECNICA: cambio protetto sotto le gambe · TATTICA: grande pressione','Piede lontano dalla palla leggermente avanti, palleggio controllato al ginocchio, spinta esterno-interno sotto le gambe, ricezione e cambio di velocità.'],
['Palleggio','Giro in palleggio / virata','Perno|Dorsale|Testa|Tiro-palla|Accelero','TECNICA: giro dorsale · TATTICA: poco spazio, pressione diretta','Piede opposto alla mano di palleggio come perno, testa gira per prima, giro dorsale; la stessa mano tira la palla nella nuova direzione, poi cambio mano e accelerazione.'],
['Palleggio','Hesitation','Veloce|Finta-arresto|Spalle|Leggo|Riparto','TECNICA: finta di arresto · TATTICA: sbilanciare in situazione dinamica','Da palleggio veloce fingo arresto alzando le spalle ma tengo gambe pronte; leggo il difensore e riparto con cambio di velocità.'],
['Palleggio','Hockey dribbling','Ritmo|Piedi|Palla|Distanza|Ripartenza','TECNICA: variazione coordinata · TATTICA: difensore a distanza incerta','Vario insieme ritmo del palleggio e movimento dei piedi per mandare fuori equilibrio un difensore a distanza incerta, poi accelero.'],
['Palleggio','Finta di cambio di mano','Esterno|Finta|Baricentro|Interno|Accelero','TECNICA: fingo cambio e continuo · TATTICA: campo aperto','Fingo la spinta per cambiare mano, abbasso il baricentro, ruoto la mano sulla parte interna della palla e spingo forte avanti-laterale accelerando.'],
['Passaggio','Passaggio','Linea|Tipo|Punto|Tempo|Vantaggio','TECNICA: scegliere traiettoria coerente · TATTICA: mantenere vantaggio','Leggo la linea aperta, scelgo il tipo di passaggio e faccio arrivare la palla al punto giusto nel momento giusto per mantenere il vantaggio.'],
['Passaggio','Passaggio due mani dal petto','Petto|Gomiti|Spinta|Frustata|Passo','TECNICA: catena gambe-braccia-polsi · TATTICA: linea aperta dal petto','Palla davanti al petto, gomiti naturalmente stretti, spinta di gambe e braccia, rotazione/frustata di polsi e dita e passo verso il ricevente.'],
['Passaggio','Passaggio due mani schiacciato','Cintola|Basso|Rimbalzo|Due-terzi|Spazio','TECNICA: traiettoria battuta · TATTICA: linea aerea chiusa','Parte circa dalla cintola, spinta verso il basso e rimbalzo intorno ai due terzi della distanza; utile con spazio quando la linea aerea non è aperta.'],
['Passaggio','Passaggio sopra la testa','Fronte|Gomiti|Distendo|Polsi|Passo','TECNICA: linea alta · TATTICA: sopra spalle/testa','Palla sopra la fronte, gomiti sotto, distensione verso il ricevente, spinta di polsi e mani e piccolo passo.'],
['Passaggio','Passaggio laterale','Laterale|Spazio|Passo|Distendo|Frustata','TECNICA: allargare linea laterale · TATTICA: spazio al lato del difensore','Porto la palla lateralmente, allargo lo spazio con un passo, distendo e frusto polso e dita per utilizzare la linea vantaggiosa laterale.'],
['Passaggio','Passaggio consegnato','Dorsale|Protezione|Sopra-sotto|Ricevente|Aggressivo','TECNICA: consegna protetta · TATTICA: spazi ridotti','Mezzo giro dorsale per proteggere, una mano sopra e una sotto la palla; il compagno riceve lateralmente con movimento aggressivo.'],
['Passaggio','Passaggio baseball','Orecchio|Posteriore|Torsione|Distendo|Passo','TECNICA: catena lunga · TATTICA: coprire grande spazio in poco tempo','Palla vicino all’orecchio, peso sul piede posteriore e torsione; distensione completa, frustata di polso/dita e passo avanti.'],
['Passaggio','Passaggio da palleggio','Dietro|Distendo|Frustata|Passo|Tempo','TECNICA: passare senza raccolta · TATTICA: rubare tempo','La mano passa da sopra a dietro la palla, distendo il braccio e frusto polso e dita verso il ricevente, accompagnando con il passo.'],
['Con palla','Finte con e senza palla','Tempo|Intensità|Credibile|Reazione|Spazio','TECNICA: finta credibile · TATTICA: mandare fuori equilibrio','La finta deve avere tempo e intensità corretti per provocare una reazione; leggo la risposta del difensore e utilizzo la linea/spazio liberato.'],
['Tiro','Tiro: concetto generale','Pollici-T|Polpastrelli|Adattamento|Spazio|Vantaggio','TECNICA: presa e gesto adattato · TATTICA: concretizzare vantaggio','Presa con pollici a T e palla sui polpastrelli; la tecnica è adattata al giocatore. Il tipo di tiro dipende da spazio, tempo, forza e difesa.'],
['Tiro','Tiro da fermo','Allineamenti|Avampiedi|Distensione|Frustata|Indice','TECNICA: catena dal basso · TATTICA: insegnamento e tiro libero','Occhi al canestro, allineamenti corretti, peso sugli avampiedi; distendo caviglie-gambe-schiena-spalle-braccia, poi frustata e rilascio con indice.'],
['Tiro','Tiro in elevazione','Allineamenti|Distensione|Salgo|Frustata|Controtempo','TECNICA: tiro mentre salgo · TATTICA: controtempo/carenza forza','Preparazione come tiro da fermo; distensione coordinata e rilascio mentre si salta, con frustata a braccia distese. Non confonderlo con la sospensione.'],
['Tiro','Tiro in sospensione','Spinta-massima|Salto|Quasi-apice|Rilascio|Ricaduta','TECNICA: rilascio vicino alla massima sospensione · TATTICA: tirare sopra il difensore','Spinta massima per saltare, rilascio un attimo prima della massima sospensione e ricaduta nel punto di stacco o poco avanti.'],
['Tiro','Tiro ad uncino / semigancio','Opposto|Protezione|Orecchio|Distendo|Frustata','TECNICA: palla lontana dal difensore · TATTICA: spazio ristretto/giocatore alto','Passo col piede opposto alla mano di tiro, palla protetta vicino all’orecchio, distensione del braccio e frustata di polso e dita.'],
['Tiro','Tiro in corsa: terzo tempo','Omologo|Opposto|Due-appoggi|Ginocchio|Alto','TECNICA: due appoggi · TATTICA: spazio in avvicinamento','Primo appoggio omologo alla mano di tiro, secondo opposto; spinta verso l’alto con ginocchio lato tiro, rilascio al punto alto e ricaduta in equilibrio.'],
['Tiro','Tiro in corsa: secondo tempo','Presa|Un-appoggio|Opposto|Spinta|Tempo','TECNICA: un appoggio · TATTICA: rubare tempo con poco spazio','Presa lontana dal difensore, un appoggio di norma opposto alla mano di tiro, spinta in alto, distensione/frustata e ricaduta in equilibrio.'],
['Difesa','Posizione fondamentale difensiva','Piedi|Avampiedi|Mani|Palmi|Occhi','TECNICA: piedi carichi e mani attive · TATTICA: pronti a difendere','Piedi poco più larghi delle spalle, peso sugli avampiedi, mani/braccia attive, palmi alla palla e capo eretto. La distanza si adatta alla palla.'],
['Difesa','Posizione sul palleggiatore','Posizione|Mano-opposta|Ginocchia|Concorde|Traccia','TECNICA: mani con compiti diversi · TATTICA: contenere e togliere linee','Mano opposta alla mano di palleggio tra le ginocchia; mano concorde traccia la palla e chiude la linea di passaggio.'],
['Difesa','Scivolamenti difensivi','Piedi-vivi|Spinta-opposta|Apre|Ristabilisce|Mani','TECNICA: non incrociare · TATTICA: raggiungere spazio vantaggioso','Spingo col piede opposto alla direzione; apre per primo il piede verso cui mi muovo, il secondo ristabilisce distanza ed equilibrio.'],
['Difesa','Scivolo, corro, scivolo','Scivolo|Incrocio|Corro|Recupero|Scivolo','TECNICA: recuperare e ristabilire posizione · TATTICA: riconquistare spazio-tempo','Quando perdo spazio-tempo passo dalla difesa alla corsa mantenendo busto aperto alla palla; recuperato lo spazio torno a scivolare.'],
['Difesa','Linee del posizionamento difensivo','Passaggio|Penetrazione|Palla|Posizione|Rotazione','TECNICA/TATTICA: tre linee guidano la posizione','Linea di passaggio collega palla e giocatore senza palla; linea di penetrazione palla-canestro; linea della palla è parallela alla linea di fondo.'],
['Difesa','Anticipo chiuso','Uomo|Petto|Lato-palla|Pollice-giù|Negare','TECNICA: priorità uomo senza palla · TATTICA: negare ricezione','Petto verso il giocatore senza palla, piede e mano lato palla sulla linea, palmo verso la palla e pollice in basso; utile per negare ricezione.'],
['Difesa','Anticipo aperto','Palla|Petto|Lato-uomo|Pollice-su|Aiuto','TECNICA: priorità palla · TATTICA: leggere penetrazione e aiuto','Petto verso la palla, piede e mano lato uomo sulla linea, palmo alla palla e pollice verso l’alto; mantiene lettura della penetrazione.'],
['Difesa','Difesa sul giocatore senza palla','Palla|Linea|Uomo|Visione|Taglio','TECNICA: posizione dinamica · TATTICA: negare ricezioni vantaggiose','La posizione cambia con la palla: controllo linea di passaggio mantenendo visione di uomo e palla e proteggendo tagli e spazi pericolosi.'],
['Difesa','Linea di passaggio e anticipo','Linea|Piede|Mano|Equilibrio|Back-door','TECNICA: occupare linea utile · TATTICA: negare collegamento','Piede e mano lato palla occupano la linea; distanza ed equilibrio devono permettere anticipo senza concedere facilmente il back-door.'],
['Postulati','Spazio','Vedere|Creare|Occupare|Attaccare|Vantaggio','POSTULATO: ogni gesto si adatta allo spazio','Leggo lo spazio disponibile in relazione a palla, compagni e difensori; lo creo, occupo o attacco per ottenere un vantaggio.'],
['Postulati','Tempo','Leggere|Momento|Anticipare|Sincronizzare|Vantaggio','POSTULATO: fare la cosa utile nel momento utile','La scelta tecnica deve avvenire nel tempo concesso dal gioco e sincronizzarsi con palla, compagni e difesa.'],
['Postulati','Equilibrio','Piedi|Baricentro|Controllo|Adattamento|Efficacia','POSTULATO: controllo dinamico del corpo','Appoggi e baricentro si adattano continuamente alla situazione per consentire controllo, rapidità e precisione.'],
['Postulati','Autonomia','Leggere|Scegliere|Decidere|Eseguire|Responsabilità','POSTULATO: il giocatore decide','L’obiettivo è un giocatore capace di leggere, scegliere ed eseguire autonomamente, non di riprodurre soltanto ordini.'],
['Concetti','Creare vantaggio','Spazio|Difensore|Lettura|Scelta|Superare','CONCETTO: modificare la situazione a favore dell’attacco','Creo vantaggio quando la mia scelta costringe la difesa a perdere posizione, equilibrio o tempo e genera spazio utile.'],
['Concetti','Mantenere vantaggio','Spaziatura|Continuità|Passaggio|Movimento|Collaborazione','CONCETTO: non restituire alla difesa il vantaggio','Mantengo il vantaggio con spaziatura, movimento, passaggio e lettura degli aiuti, dando continuità all’azione.'],
['Concetti','Concretizzare vantaggio','Leggere|Continuare|Passare|Concludere|Canestro','CONCETTO: trasformare il vantaggio in conclusione efficace','Concretizzo scegliendo il momento e la soluzione per arrivare a una conclusione efficace direttamente o tramite un compagno.'],
['Concetti','Fondamentale acquisito','Leggere|Scegliere|Eseguire|Adattare|Vantaggio','CONCETTO: non basta saper fare','Il fondamentale è realmente acquisito quando il giocatore sa quando e perché usarlo: legge, sceglie, esegue e adatta.'],
['Concetti','Progressione didattica','1c0|1c1|2c2|3c3|Gioco','METODO: imparo → leggo → collaboro → gioco','Parto dall’acquisizione e correzione in 1c0, introduco lettura del difensore in 1c1, collaborazione in 2c2 e trasferimento nel gioco in 3c3.'],
['Concetti','Leggere → scegliere → eseguire','Percepire|Capire|Scegliere|Eseguire|Verificare','METODO: tecnica al servizio della decisione','Percepisco le informazioni, interpreto la situazione, scelgo la risposta, eseguo e uso l’esito come nuova informazione.']
];
const COLORS={'Senza palla':['SP','#2563eb'],'Con palla':['CP','#7c3aed'],'Palleggio':['PAL','#059669'],'Passaggio':['PAS','#d97706'],'Tiro':['TIR','#dc2626'],'Difesa':['DIF','#0891b2'],'Postulati':['POST','#8b5cf6'],'Concetti':['CONC','#be185d']};
const DATA=D.map((x,i)=>({n:i+1,cat:x[0],title:x[1],words:x[2].split('|'),logic:x[3],answer:x[4],abbr:COLORS[x[0]][0],color:COLORS[x[0]][1]}));
count.textContent=DATA.length+' schede';
DATA.forEach(x=>{const b=document.createElement('button');b.className='card';b.style.setProperty('--accent',x.color);b.innerHTML='<span class="num">'+x.n+'</span><span class="abbr">'+x.abbr+'</span><span class="name">'+x.title+'</span>';b.onclick=()=>openCard(x);grid.appendChild(b)});
function openCard(x){sheet.style.setProperty('--accent',x.color);mCat.textContent=x.cat.toUpperCase();mTitle.textContent=x.title;mWords.innerHTML=x.words.map(w=>'<span class="word">'+w+'</span>').join('');mLogic.textContent=x.logic;mAnswer.textContent=x.answer;modal.classList.add('open')}
function closeCard(){modal.classList.remove('open')} closeBtn.onclick=closeCard;modal.onclick=e=>{if(e.target===modal)closeCard()};
const order=[['Senza palla','SP','#2563eb'],['Con palla','CP','#7c3aed'],['Palleggio','PAL','#059669'],['Passaggio','PAS','#d97706'],['Tiro','TIR','#dc2626'],['Difesa','DIF','#0891b2'],['Postulati','POST','#8b5cf6'],['Concetti','CONC','#be185d']];
legend.innerHTML=order.map(x=>'<span><i class="dot" style="background:'+x[2]+'"></i>'+x[1]+'</span>').join('');
function tick(){const d=new Date();time.textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
clockHot.onclick=()=>{tick();clock.classList.add('open')};clockBackHot.onclick=e=>{e.stopPropagation();clock.classList.remove('open')};clock.onclick=e=>e.stopPropagation();tick();setInterval(tick,1000);
</script>
</body></html>
