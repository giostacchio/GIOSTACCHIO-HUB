<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest?v=1">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Installa GIOSTACCHIO HUB</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(180deg,#090d19,#10172b);color:#f5f7ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:20px}.box{width:min(480px,100%);background:#141b31;border:1px solid #2a3558;border-radius:24px;padding:24px;text-align:center;box-shadow:0 22px 60px rgba(0,0,0,.35)}img{width:112px;height:112px;border-radius:26px;margin-bottom:12px}h1{margin:6px 0 8px;font-size:30px}p{color:#aeb8d0;line-height:1.5}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;background:#74a7ff;color:#061126;font-weight:900;font-size:17px;margin-top:10px}.link{display:block;margin-top:14px;color:#a9c5ff;text-decoration:none}.hint{margin-top:18px;padding:12px;border-radius:13px;background:#0e1730;color:#cbd5ec;font-size:13px}.ok{color:#6ee7a2;font-weight:800}
</style>
</head>
<body>
<div class="box">
<img src="icon.svg" alt="GIOSTACCHIO HUB">
<h1>GIOSTACCHIO HUB</h1>
<p>Installa il centro unico dei tuoi programmi come app autonoma.</p>
<button class="btn" id="install">Installa HUB</button>
<a class="link" href="./">Apri HUB senza installare</a>
<div class="hint" id="hint">Se il pulsante non apre l'installazione, usa i <b>⋮ tre puntini di Chrome</b> → <b>Installa app</b> o <b>Aggiungi a schermata Home</b>.</div>
</div>
<script>
let deferredPrompt=null;const btn=document.getElementById('install'),hint=document.getElementById('hint');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;btn.disabled=false;});
btn.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();const r=await deferredPrompt.userChoice;if(r.outcome==='accepted'){hint.innerHTML='<span class="ok">HUB installato.</span> Ora lo trovi nella schermata Home o nel cassetto app.'}deferredPrompt=null}else{hint.innerHTML='Apri il menu <b>⋮</b> di Chrome e scegli <b>Installa app</b> o <b>Aggiungi a schermata Home</b>.'}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body>
</html>
